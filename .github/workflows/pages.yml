name: Deploy «SPM Pharmacy» to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Важно: без environment github-pages — в репозитории на нём висит
    # branch_policy, разрешающий деплой только из старой task-ветки,
    # из-за чего деплой из main отклонялся. Без environment деплой идёт напрямую.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload artifact (весь статический сайт, сборка не нужна)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPM Pharmacy — интернет-аптека</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="apple-touch-icon" href="assets/logo.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- верхняя полоса магазина: как у любого сайта, но чуть «не так» -->
<header id="topbar">
  <a class="brand" href="#/">
    <img src="assets/logo.svg" alt="" width="22" height="32">
    <span class="brand-name">SPM PHARMACY</span>
  </a>
  <nav id="nav">
    <a href="#/">Каталог</a>
    <a href="#/about">О магазине</a>
    <a href="#/" id="nav-delivery">Доставка</a>
  </nav>
  <div id="topbar-right">
    <span id="clock">4:17</span>
    <button id="cart-btn" class="ghost-btn">Корзина (<span id="cart-count">0</span>)</button>
  </div>
</header>

<main id="app"><!-- контент страницы --></main>

<footer id="foot">
  <p>«SPM Pharmacy» — интернет-аптека · работаем с 2007 года<br>
  доставка по городу ночью · оплата при получении · чек прилагается</p>
  <p class="foot-small">все товары сертифицированы · <span id="year"></span></p>
</footer>

<!-- выдвижная корзина -->
<aside id="cart-drawer" aria-hidden="true">
  <div class="drawer-head">
    <h2>Ваша корзина</h2>
    <button id="cart-close" class="ghost-btn">✕</button>
  </div>
  <div id="cart-items"></div>
  <div class="drawer-foot">
    <div class="cart-total">итого: <b id="cart-total">0</b> росинок</div>
    <button id="checkout" class="buy-btn big">оформить заказ</button>
    <p class="cart-note">оплата при получении · чек прилагается · сдачи не будет</p>
  </div>
</aside>
<div id="scrim"></div>

<!-- карточка товара -->
<div id="modal" aria-hidden="true">
  <button id="modal-close" class="ghost-btn">✕</button>
  <div id="modal-body"></div>
</div>

<div id="toasts"></div>

<script src="data.js"></script>
<script src="art.js"></script>
<script src="ambient.js"></script>
<script src="app.js"></script>
</body>
</html>
